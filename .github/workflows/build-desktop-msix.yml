name: Build desktop app

# Desktop releases are tagged `desktop-v*` so they never collide with the Android
# `v*` tags in this same repository (see .github/workflows for those).
on:
  workflow_dispatch:
    inputs:
      store_packages:
        description: 'Also build unsigned Store packages, for a manual Partner Center upload'
        type: boolean
        default: false
  # A `desktop-v*` tag publishes a release; a push/PR touching apps/desktop only
  # compiles. That compile-only run is the point: WinUI 3 is outside
  # `npm run validate` and cannot be built in the Linux devcontainer at all, so
  # without it a broken csproj or a XAML/code-behind mismatch would not surface
  # until release day.
  push:
    tags:
      - 'desktop-v*'
    branches: [main]
    paths:
      - 'apps/desktop/**'
      - '.github/workflows/build-desktop-msix.yml'
  pull_request:
    paths:
      - 'apps/desktop/**'
      - '.github/workflows/build-desktop-msix.yml'

jobs:
  build:
    runs-on: windows-2025

    strategy:
      fail-fast: false
      matrix:
        platform: [x64, ARM64]

    defaults:
      run:
        working-directory: apps/desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The "Our other apps" page lives in the private external/promo
          # submodule, and the csproj imports it unconditionally, so a checkout
          # without it does not compile. SUBMODULES_TOKEN is a PAT with read
          # access to RyanEwen/technicallyreal-promo; the github.token fallback
          # keeps forks building everything up to that import.
          submodules: true
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Read version
        id: version
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $ver = ($props.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version
          echo "VERSION=$ver" >> $env:GITHUB_OUTPUT
          Write-Host "Detected version: $ver"

      # Before the build: the icons are gitignored build output, and the csproj
      # only picks up ApplicationIcon when the .ico already exists. Generating
      # after would produce a binary with no icon.
      - name: Generate images
        shell: pwsh
        run: .\Persistent.DesktopMSIX\generate-msix-images.ps1

      - name: Build
        shell: pwsh
        run: dotnet build Persistent.Desktop/Persistent.Desktop.csproj -c Release -p:Platform=${{ matrix.platform }}

      # Published on EVERY run, not just tags: a portable zip is the only way to
      # try a build without first trusting a self-signed certificate, so it needs
      # to be downloadable from the Actions page of any commit.
      # -NoZip: upload-artifact zips whatever it is given, so handing it a .zip
      # produces a zip containing a zip. Point it at the published folder and the
      # download is a single archive that unzips straight to the exe.
      - name: Publish portable
        shell: pwsh
        run: .\publish-portable.ps1 -Platform ${{ matrix.platform }} -NoZip

      - name: Upload portable
        uses: actions/upload-artifact@v4
        with:
          name: Persistent.Desktop-${{ steps.version.outputs.VERSION }}-${{ matrix.platform }}-portable
          path: apps/desktop/artifacts/Persistent.Desktop-*-portable/
          if-no-files-found: error

      # The first Store submission has to be uploaded by hand (the msstore CLI can
      # only update an app that is already live), and the Linux devcontainer cannot
      # produce an MSIX at all - so this is how those packages get built. Unsigned
      # and carrying the real Partner Center identity, which is what Partner Center
      # wants; it re-signs at ingestion.
      #
      # Safe to publish as an artifact here because Persistent is free. Do not copy
      # this step to a paid app in a public repo: artifacts need only read access to
      # download, which on a public repo means anyone.
      - name: Package MSIX for the Store
        if: inputs.store_packages
        shell: pwsh
        run: .\Persistent.DesktopMSIX\build-msix.ps1 -Platform ${{ matrix.platform }} -Store

      - name: Upload Store package
        if: inputs.store_packages
        uses: actions/upload-artifact@v4
        with:
          name: store-msix-${{ steps.version.outputs.VERSION }}-${{ matrix.platform }}
          path: apps/desktop/Persistent.DesktopMSIX/*.msix
          if-no-files-found: error

      # Release assets are attached as-is, so the portable build needs a real zip
      # here — unlike the artifact above, which GitHub archives on download.
      - name: Zip portable for the release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: pwsh
        run: |
          $folder = Get-ChildItem artifacts -Directory | Where-Object { $_.Name -like '*portable' } | Select-Object -First 1
          if (-not $folder) { throw 'No portable folder to zip' }
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Compress-Archive -Path "$($folder.FullName)\*" -DestinationPath "release\$($folder.Name).zip"

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.platform }}
          path: apps/desktop/release/*.zip
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          # The portable zip and nothing else. An MSIX belongs to the Store,
          # which needs a different package entirely: unsigned, carrying the real
          # Partner Center identity (`store-publish.yml` builds that one). The MSIX
          # this job used to attach was the *sideload* build, signed with a
          # self-signed `CN=Persistent Dev` certificate, so installing it meant
          # trusting that certificate first. That is a bad thing to hand a stranger
          # and it was never the Store package either, so it served neither
          # audience.
          #
          # `**` is load-bearing. upload-artifact roots each artifact at the least
          # common ancestor of its paths - here `apps/desktop` - so the files come
          # back down a level, as `release/*.zip`. A flat `artifacts/*.zip` matches
          # nothing.
          files: artifacts/**/*.zip
          # Without this the action only *warns* on an unmatched pattern and still
          # publishes - which is exactly how desktop-v0.2.0 first went out with zero
          # assets while the job reported success.
          fail_on_unmatched_files: true
          generate_release_notes: true
          # Both architectures land on one release; the tag already names the app,
          # which matters because Android releases share this repo's release list.
          name: Persistent for Windows ${{ github.ref_name }}
          # Never claim "Latest" - that belongs to the Android app, which is what
          # the README's download badge and /releases/latest are expected to mean.
          # Left to GitHub's default, whichever of the two shipped most recently
          # won, and desktop-v0.2.3 was in fact answering /releases/latest.
          make_latest: false

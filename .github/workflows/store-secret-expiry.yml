name: store-secret-expiry

# Warn before the Entra client secret behind store-publish.yml expires.
#
# Entra secrets last 24 months at most, which is long enough to forget entirely.
# The failure mode without this is bad: the reminder that it lapsed is a failed
# Store submission, discovered on the day you wanted to ship, with an auth error
# that names nothing useful.
#
# There is no API call that answers "when does my own secret expire?" - reading
# an app registration's passwordCredentials needs Graph permissions the Store
# credential does not have and should not be given. So the date is recorded as a
# repository VARIABLE (not a secret; an expiry date is not sensitive, and keeping
# it readable is the point) when the secret is set:
#
#   apps/desktop/set-ci-secrets.sh
#
# That script writes STORE_SECRET_EXPIRES alongside AZURE_AD_APPLICATION_SECRET,
# so the two cannot drift: rotating the secret is what updates the date.
#
# This deliberately does NOT open an issue. A failed scheduled run already emails
# the repo owner, and this repository is public - an issue announcing exactly when
# the publishing credential lapses is free information for anyone watching.

on:
  schedule:
    # Mondays at 13:00 UTC (9 a.m. Toronto in EDT, 8 a.m. in EST).
    - cron: '0 13 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check the Store credential's expiry
        env:
          EXPIRES: ${{ vars.STORE_SECRET_EXPIRES }}
          # Start warning this far out. Long enough to schedule it rather than
          # scramble, since rotating means a portal visit plus a script run.
          WARN_DAYS: '60'
        run: |
          set -euo pipefail

          if [ -z "${EXPIRES}" ]; then
            echo "::error::STORE_SECRET_EXPIRES is not set, so nothing is watching the Store credential."
            echo "Set it with: apps/desktop/set-ci-secrets.sh --only AZURE_AD_APPLICATION_SECRET"
            echo "Or directly:  gh variable set STORE_SECRET_EXPIRES --body YYYY-MM-DD"
            exit 1
          fi

          # Reject a malformed date rather than letting `date` coerce it into
          # something plausible and silently wrong.
          if ! printf '%s' "${EXPIRES}" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
            echo "::error::STORE_SECRET_EXPIRES is '${EXPIRES}', expected YYYY-MM-DD."
            exit 1
          fi

          expires_at=$(date -u -d "${EXPIRES}" +%s)
          now=$(date -u +%s)
          days=$(( (expires_at - now) / 86400 ))

          {
            echo "## Microsoft Store credential"
            echo
            echo "\`AZURE_AD_APPLICATION_SECRET\` expires **${EXPIRES}** (${days} days)."
            echo
            echo "Rotate with:"
            echo '```'
            echo "# Entra > App registrations > your app > Certificates & secrets > New client secret"
            echo "./apps/desktop/set-ci-secrets.sh --only AZURE_AD_APPLICATION_SECRET"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${days}" -lt 0 ]; then
            echo "::error::The Store credential expired ${EXPIRES} ($(( -days )) days ago). store-publish.yml cannot authenticate."
            exit 1
          fi

          if [ "${days}" -le "${WARN_DAYS}" ]; then
            echo "::error::The Store credential expires in ${days} days (${EXPIRES}). Rotate it."
            exit 1
          fi

          echo "Store credential expires ${EXPIRES} - ${days} days away, nothing to do."

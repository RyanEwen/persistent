name: play-promote

# Recover an already-uploaded version onto production without rebuilding.
# Retire phone testing releases in the same edit. Normal tagged releases publish
# directly to production; this manual path also adjusts a production rollout.
#
on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'versionCode to promote (must already be on a Play track)'
        required: true
        type: string
      rollout:
        description: 'Staged rollout fraction, e.g. 0.2 for 20%. Leave empty to release to everyone.'
        required: false
        type: string

permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 20

      # No `npm ci`: the script is dependency-free by design (Node 20 has fetch
      # and RS256 signing built in), so this needs nothing from the workspace.
      - name: Promote versionCode ${{ inputs.version_code }} to production
        working-directory: apps/mobile
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          node scripts/play-publish.mjs --promote \
            --version-code '${{ inputs.version_code }}' \
            --tracks production --production-only \
            ${{ inputs.rollout && format('--rollout ''{0}''', inputs.rollout) || '' }}

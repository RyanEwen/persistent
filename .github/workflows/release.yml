name: release

# On a `v*` tag (e.g. `git tag v0.2.0 && git push origin v0.2.0`), build both
# Android flavors and ship them to their respective channels:
#
#   direct -> signed APK attached to a GitHub Release. The in-app update check
#             (apps/web/src/native/UpdateCheck.tsx) reads that release and offers
#             the new APK.
#   play   -> AAB released to Google Play on the `internal` **and** `alpha` tracks
#             (one build, one versionCode, both tracks), and kept as a workflow
#             artifact either way.
#
# Both tracks come from a single Play edit — see apps/mobile/scripts/play-publish.mjs
# for why that matters. `workflow_dispatch` can retarget the tracks/status for a
# one-off; promotion beyond alpha stays a deliberate Console action.
#
# The Play upload is skipped unless PLAY_SERVICE_ACCOUNT_JSON is set, so this runs
# unchanged on forks. See apps/mobile/store/play-readiness.md for the Play Console
# setup this assumes.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing tag to build (e.g. v0.2.0) — the build uses that tag, not the branch'
        required: true
      play_tracks:
        description: 'Play track(s) to release to'
        required: false
        default: 'internal,alpha'
        type: choice
        # Quoted: inside a YAML flow sequence an unquoted comma would split this
        # into two separate options.
        options: ['internal,alpha', 'internal', 'alpha', 'beta', 'production']
      play_status:
        description: "Play release status ('draft' holds the release in the Console instead of giving it to testers)"
        required: false
        default: completed
        type: choice
        options: [completed, draft]

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # A dispatch names a tag, so build *that* tag rather than whichever
          # branch the run was dispatched from — otherwise the artifact carries
          # the tag's version name but the branch's code.
          ref: ${{ github.event.inputs.version || github.ref }}
          fetch-depth: 0 # full history + tags so we can build a changelog

      - name: Resolve version
        id: ver
        run: |
          TAG="${{ github.event.inputs.version || github.ref_name }}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "name=${TAG#v}" >> "$GITHUB_OUTPUT"
          # versionCode must strictly increase and never repeat across everything
          # ever published, on Play or as a sideload APK. The run number does that
          # on its own; PLAY_VERSION_CODE_OFFSET is the escape hatch for when a
          # manual upload already burned a higher code (the pre-flight below prints
          # the exact offset to set). Raise it only — lowering it re-burns codes.
          OFFSET="${{ vars.PLAY_VERSION_CODE_OFFSET || 0 }}"
          echo "code=$(( ${{ github.run_number }} + OFFSET ))" >> "$GITHUB_OUTPUT"
          echo "tracks=${{ github.event.inputs.play_tracks || 'internal,alpha' }}" >> "$GITHUB_OUTPUT"
          echo "status=${{ github.event.inputs.play_status || 'completed' }}" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          PREV=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
          RANGE="${TAG}"
          [ -n "$PREV" ] && RANGE="${PREV}..${TAG}"
          # These notes are shown verbatim in the in-app update prompt and, trimmed
          # to Play's 500-character cap, as the Play release's "what's new". List
          # only changes an end user cares about. Drop internal-only commits:
          # version bumps/merges, docs, chores/tooling/CI, deps, refactors/tests,
          # and security-header plumbing. Tune EXCLUDE if a category should
          # resurface. A commit that mixes user-facing + internal work is dropped
          # if it matches any term, so prefer splitting such commits.
          EXCLUDE='^- (bump version|merge )|\b(docs?|documentation|readme|changelog|jsdoc|chore|ci|workflow|lint|eslint|prettier|typecheck|tsconfig|devcontainer|dockerfile|compose|gitignore|deps?|dependency|dependencies|refactor|rename|cleanup|clean up|tidy|reorganize|restructure|test|tests|spec|csp|coop|coep|cors|co-?authored?)\b'
          # Scoped by PATH as well as by keyword. These notes ship to the Play
          # listing and the in-app update prompt for *Android*, so a commit that
          # touched none of the code Android runs has no business in them. The
          # keyword list alone could not know that: apps/desktop (the Windows tray
          # app) landed a dozen commits that matched no term, and v0.19.0 shipped
          # "Fix an illegal '--' in the csproj comment" to Google Play as a
          # user-facing change. A commit touching both still appears, correctly.
          PATHS='apps/web apps/mobile apps/api packages/shared'
          CHANGES=$(git log --no-merges --pretty=format:'- %s' "$RANGE" -- $PATHS | grep -viE "$EXCLUDE" || true)
          [ -z "$CHANGES" ] && CHANGES="- Maintenance and behind-the-scenes improvements"
          {
            echo "## What's changed"
            echo
            echo "$CHANGES"
            if [ -n "$PREV" ]; then
              echo
              echo "**Full changelog**: https://github.com/${{ github.repository }}/compare/${PREV}...${TAG}"
            fi
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      # --- Google Play pre-flight -------------------------------------------
      # Inert without PLAY_SERVICE_ACCOUNT_JSON, so forks and key-less runs still
      # produce the APK. `secrets` can't be read in a step-level `if`, hence the
      # probe step.
      - name: Check Play publishing config
        id: play
        env:
          PLAY_SA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$PLAY_SA" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Play service account present — will publish to: ${{ steps.ver.outputs.tracks }}"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "PLAY_SERVICE_ACCOUNT_JSON not set — skipping Play upload (AAB is still a workflow artifact)."
          fi

      # Runs before the Android build on purpose: versionCode is baked in at
      # assemble time, so a collision found here costs 20s instead of failing the
      # upload after a full build. Also proves the service account can reach the
      # app before anything is built.
      - name: Pre-flight Play release
        if: steps.play.outputs.enabled == 'true'
        working-directory: apps/mobile
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: node scripts/play-publish.mjs --check --version-code ${{ steps.ver.outputs.code }}

      - name: Install workspace deps
        run: npm ci

      - name: Build web bundle
        run: |
          npm run build --workspace @persistent/shared
          npm run build --workspace @persistent/web

      - name: Install mobile deps
        working-directory: apps/mobile
        run: npm ci

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - name: Decode release keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build signed APK
        working-directory: apps/mobile
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_NAME: ${{ steps.ver.outputs.name }}
          ANDROID_VERSION_CODE: ${{ steps.ver.outputs.code }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          npx cap add android
          npm run setup:android
          # FCM client config: write google-services.json so the google-services
          # gradle plugin activates. Skipped (build still succeeds, FCM inert) when
          # the secret isn't set, e.g. on forks.
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 -d > android/app/google-services.json
            echo "wrote android/app/google-services.json"
          else
            echo "GOOGLE_SERVICES_JSON not set — building without FCM"
          fi
          npx cap sync android
          # `direct` is the sideloaded flavor — it keeps the in-app updater that
          # GitHub-release installs rely on. The `play` flavor omits it (Play
          # forbids self-updating), so it must never be the artifact published here.
          npm run assemble:release
          npm run bundle:play

      # The play AAB must not carry REQUEST_INSTALL_PACKAGES — that is the signal
      # Play review rejects, and the two flavors are one gradle typo apart. Cheap
      # to assert, so assert it rather than trusting the flavor wiring.
      - name: Verify the Play bundle has no self-updater
        working-directory: apps/mobile
        run: |
          # Located by search, not a fixed path: AGP moves packaged_manifests
          # between versions, and a stale path here would silently stop checking.
          # A permission that IS present fails the release; a manifest that cannot
          # be found only warns, so an AGP upgrade doesn't block shipping.
          FOUND=0
          while IFS= read -r manifest; do
            FOUND=1
            COUNT=$(grep -c REQUEST_INSTALL_PACKAGES "$manifest" || true)
            if [ "$COUNT" != "0" ]; then
              echo "::error::$manifest declares REQUEST_INSTALL_PACKAGES ($COUNT) — Play prohibits a self-updating app."
              exit 1
            fi
            echo "clean (0 REQUEST_INSTALL_PACKAGES): $manifest"
          done < <(find android/app/build/intermediates/packaged_manifests -ipath '*playRelease*' -name AndroidManifest.xml 2>/dev/null)
          if [ "$FOUND" = "0" ]; then
            echo "::warning::No playRelease packaged manifest found — updater check skipped. See apps/mobile/store/play-readiness.md #1."
          fi

      - name: Stage APK
        run: |
          cp apps/mobile/android/app/build/outputs/apk/direct/release/app-direct-release.apk \
             "persistent-${{ steps.ver.outputs.name }}.apk"

      - name: Stage Play bundle
        run: |
          cp apps/mobile/android/app/build/outputs/bundle/playRelease/app-play-release.aab \
             "persistent-${{ steps.ver.outputs.name }}-play.aab"

      # The AAB is a workflow artifact, not a release asset: it is for uploading to
      # the Play Console, and publishing it next to the sideload APK would invite
      # installing the wrong one.
      - name: Upload Play bundle
        uses: actions/upload-artifact@v4
        with:
          name: play-bundle-${{ steps.ver.outputs.name }}
          path: persistent-*-play.aab
          if-no-files-found: error

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          body_path: RELEASE_NOTES.md
          files: persistent-*.apk
          # The app release is the one "Latest" should mean. Desktop releases pin
          # make_latest: false for the same reason - they interleave with these by
          # date, so whoever shipped most recently would otherwise own /releases/latest,
          # and the README's Android download badge points straight at it.
          make_latest: true

      # Uploads once and attaches that versionCode to every requested track in a
      # single Play edit. The "what's new" text is derived from RELEASE_NOTES.md
      # inside the script (heading and compare link stripped, truncated to Play's
      # 500-character cap on a line boundary).
      - name: Release to Google Play
        if: steps.play.outputs.enabled == 'true'
        working-directory: apps/mobile
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          node scripts/play-publish.mjs \
            --aab "$GITHUB_WORKSPACE/persistent-${{ steps.ver.outputs.name }}-play.aab" \
            --tracks "${{ steps.ver.outputs.tracks }}" \
            --version-name "${{ steps.ver.outputs.name }}" \
            --status "${{ steps.ver.outputs.status }}" \
            --notes "$GITHUB_WORKSPACE/RELEASE_NOTES.md"
